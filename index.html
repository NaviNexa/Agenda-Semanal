<style>
  :root{
    --accent:#3E6E96;
    --dark:#332F27;
    --btn-bg:#FEFDFA;
    --btn-border:#E3DAC2;
    --btn-hover-bg:#F5F1E6;
    --gray-off:#BDB29A;
    --bg:#FAF6EE;
    --dot:#EDE4D0;
    --card-bg:#FFFFFF;
    --red:#B2483C;
    --yellow:#C99A3E;
    --green:#4C8A5E;
    --border:#E3DAC2;
    --muted:#8A8270;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system, "SF Pro Rounded", "Segoe UI", Avenir, Helvetica, Arial, sans-serif;
    background:var(--bg);
    background-image: radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--dark);
    padding:20px;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:14px;
  }
  .title-block{display:flex;align-items:center;gap:10px;}
  .title-block img{height:56px;width:auto;display:block;}
  h1{font-size:22px;margin:0;font-weight:700;}
  .fecha-actual{font-size:13px;color:#6B7A87;margin-top:2px;cursor:pointer;border-bottom:1px dashed transparent;}
  .fecha-actual:hover{border-bottom-color:var(--muted);}
  .fecha-actual input[type="date"]{
    font-family:inherit;
    font-size:13px;
    border:1px solid var(--btn-border);
    border-radius:6px;
    padding:2px 6px;
    color:var(--dark);
    background:#fff;
  }

  .priority-dots{
    display:flex;
    gap:6px;
    align-items:center;
  }
  .priority-dot{
    width:14px;
    height:14px;
    border-radius:50%;
    cursor:pointer;
    border:none;
    padding:0;
    opacity:.38;
    transition:opacity .12s ease, transform .12s ease;
  }
  .priority-dot:hover{opacity:.75;transform:scale(1.15);}
  .priority-dot.active{opacity:1;box-shadow:0 0 0 2px rgba(51,47,39,0.12);}

  .backup-bar, .share-bar{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:flex-end;
  }
  .share-bar{margin-top:-6px;}

  button{
    font-family:inherit;
    font-size:13px;
    padding:8px 12px;
    border-radius:8px;
    border:1px solid var(--btn-border);
    background:var(--btn-bg);
    color:var(--dark);
    cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  button:hover{background:var(--btn-hover-bg);}
  button:disabled{opacity:.45;cursor:not-allowed;}

  button.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  button.primary:hover{background:#1E3ACC;}

  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px;
    margin-bottom:16px;
  }
  .toolbar input, .toolbar select, .toolbar textarea{
    font-family:inherit;
    font-size:13px;
    padding:8px 10px;
    border-radius:8px;
    border:1px solid var(--btn-border);
    background:#fff;
    color:var(--dark);
  }
  .toolbar input[type="text"]{flex:1;min-width:140px;}
  .toolbar textarea{flex:2;min-width:180px;resize:vertical;min-height:36px;}
  .toolbar input[type="time"]{width:100px;}

  .board{
    display:flex;
    gap:12px;
    overflow-x:auto;
    padding-bottom:4px;
  }
  .board.vertical{
    flex-direction:column;
    overflow-x:visible;
  }
  .day-col{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px;
    min-height:200px;
    display:flex;
    flex-direction:column;
    flex:1 1 0;
    min-width:190px;
  }
  .board.vertical .day-col{
    min-width:0;
    flex:none;
  }
  .day-col.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;}
  .day-header{
    font-weight:700;
    font-size:14px;
    color:var(--dark);
    padding-bottom:8px;
    margin-bottom:8px;
    border-bottom:2px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .day-count{
    font-size:11px;
    font-weight:600;
    color:#6B7A87;
    background:var(--bg);
    border-radius:10px;
    padding:2px 8px;
  }

  .card{
    background:#FBFCFD;
    border:1px solid var(--border);
    border-left:4px solid var(--gray-off);
    border-radius:8px;
    padding:8px 10px;
    margin-bottom:8px;
    cursor:grab;
  }
  .card[draggable="true"]:active{cursor:grabbing;}
  .card.rojo{border-left-color:var(--red);}
  .card.amarillo{border-left-color:var(--yellow);}
  .card.verde{border-left-color:var(--green);}
  .card.done{opacity:.55;}
  .card.done .card-text, .card.done .card-cliente{text-decoration:line-through;}

  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:6px;
  }
  .card-hora{
    font-size:12px;
    font-weight:700;
    color:var(--accent);
    white-space:nowrap;
  }
  .card-text{
    font-size:13px;
    font-weight:600;
    margin:3px 0 2px 0;
    word-break:break-word;
  }
  .card-cliente{
    font-size:12px;
    color:#5A6B78;
    margin-bottom:3px;
    word-break:break-word;
  }
  .card-nota{
    font-size:12px;
    color:#7A8894;
    white-space:pre-wrap;
    word-break:break-word;
    margin-bottom:4px;
    display:none;
  }
  .card-nota.show{display:block;}

    display:flex;
    gap:4px;
    flex-wrap:wrap;
    margin-top:4px;
  }

    padding:3px 7px;
    font-size:11px;
    border-radius:6px;

    font-size:12px;
    color:#A8B3BC;
    text-align:center;
    padding:14px 0;

    body *{visibility:hidden;}

      display:block !important;
      position:absolute;
      top:0;left:0;
      width:100%;

  .print-task{font-size:12px;margin-bottom:6px;padding-bottom:6px;border-bottom:1px dashed #ddd;}
  .print-task b{margin-right:6px;}

<script>
const DIAS = ["Lunes","Martes","Miércoles","Jueves","Viernes"];
const STORAGE_KEY = "agenda_semanal_data_v1";

let tasks = [];
let undoStack = [];
let redoStack = [];

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      tasks = parsed.tasks || [];
    }
  }catch(e){ tasks = []; }
}

function saveData(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify({tasks}));
}

function pushUndo(){
  undoStack.push(JSON.stringify({tasks}));
  if(undoStack.length > 50) undoStack.shift();
  redoStack = [];
  updateUndoRedoButtons();
}

function undo(){
  if(undoStack.length === 0) return;
  redoStack.push(JSON.stringify({tasks}));
  const prev = JSON.parse(undoStack.pop());
  tasks = prev.tasks;
  saveData();
  render();
  updateUndoRedoButtons();
}

function redo(){
  if(redoStack.length === 0) return;
  undoStack.push(JSON.stringify({tasks}));
  const next = JSON.parse(redoStack.pop());
  tasks = next.tasks;
  saveData();
  render();
  updateUndoRedoButtons();
}

function updateUndoRedoButtons(){
  document.getElementById("undoBtn").disabled = undoStack.length === 0;
  document.getElementById("redoBtn").disabled = redoStack.length === 0;
}

function uid(){
  return "t_" + Date.now() + "_" + Math.random().toString(36).slice(2,8);
}

const FECHA_KEY = "agenda_semanal_fecha_v1";

function getFechaGuardada(){
  const raw = localStorage.getItem(FECHA_KEY);
  if(raw) return raw;
  const hoy = new Date();
  return hoy.toISOString().slice(0,10);
}

function formatearFecha(isoStr){
  const [y,m,d] = isoStr.split("-").map(Number);
  const fecha = new Date(y, m-1, d);
  const opciones = {weekday:'long', day:'numeric', month:'long', year:'numeric'};
  const texto = fecha.toLocaleDateString('es-ES', opciones);
  return texto.charAt(0).toUpperCase() + texto.slice(1);
}

function setFechaActual(){
  const el = document.getElementById("fechaActual");
  const fechaISO = getFechaGuardada();
  el.textContent = formatearFecha(fechaISO);
}

function editarFecha(){
  const el = document.getElementById("fechaActual");
  const fechaISO = getFechaGuardada();
  const input = document.createElement("input");
  input.type = "date";
  input.value = fechaISO;
  el.textContent = "";
  el.appendChild(input);
  input.focus();

  function guardar(){
    if(input.value){
      localStorage.setItem(FECHA_KEY, input.value);
    }
    setFechaActual();
  }

  input.addEventListener("change", guardar);
  input.addEventListener("blur", guardar);
}

function getTodayDiaIndex(){
  // getDay(): 0=domingo,1=lunes,...6=sabado -> mapear a 0..4 (lunes..viernes)
  const d = new Date().getDay();
  if(d >= 1 && d <= 5) return d - 1;
  return -1;
}

function initDiaSelect(){
  const sel = document.getElementById("diaSelect");
  sel.innerHTML = "";
  DIAS.forEach((d, i) => {
    const opt = document.createElement("option");
    opt.value = i;
    opt.textContent = d;
    sel.appendChild(opt);
  });
  const todayIdx = getTodayDiaIndex();
  if(todayIdx >= 0) sel.value = todayIdx;
}

function addTask(){
  const dia = parseInt(document.getElementById("diaSelect").value, 10);
  const hora = document.getElementById("horaInput").value;
  const texto = document.getElementById("textoInput").value.trim();
  const cliente = document.getElementById("clienteInput").value.trim();
  const nota = document.getElementById("notaInput").value.trim();
  const prio = document.getElementById("prioInput").value;

  if(!texto){
    document.getElementById("textoInput").focus();
    return;
  }

  pushUndo();
  tasks.push({
    id: uid(),
    dia,
    hora,
    texto,
    cliente,
    nota,
    priority: prio || null,
    done: false,
    createdAt: new Date().toISOString()
  });

  document.getElementById("textoInput").value = "";
  document.getElementById("clienteInput").value = "";
  document.getElementById("notaInput").value = "";
  document.getElementById("prioInput").value = "";
  document.querySelectorAll("#prioToolbar .priority-dot").forEach(d => d.classList.remove("active"));

  saveData();
  render();
}

function toggleDone(id){
  pushUndo();
  const t = tasks.find(x => x.id === id);
  if(t) t.done = !t.done;
  saveData();
  render();
}

function deleteTask(id){
  pushUndo();
  tasks = tasks.filter(x => x.id !== id);
  saveData();
  render();
}

function editTask(id){
  const t = tasks.find(x => x.id === id);
  if(!t) return;
  const nuevoTexto = prompt("Texto de la tarea/visita:", t.texto);
  if(nuevoTexto === null) return;
  const nuevoCliente = prompt("Cliente / lugar:", t.cliente || "");
  if(nuevoCliente === null) return;
  const nuevaHora = prompt("Hora (HH:MM):", t.hora || "");
  if(nuevaHora === null) return;
  const nuevaNota = prompt("Notas:", t.nota || "");
  if(nuevaNota === null) return;

  pushUndo();
  t.texto = nuevoTexto.trim() || t.texto;
  t.cliente = nuevoCliente.trim();
  t.hora = nuevaHora.trim();
  t.nota = nuevaNota.trim();
  saveData();
  render();
}

function changePriority(id, value){
  pushUndo();
  const t = tasks.find(x => x.id === id);
  if(t) t.priority = (t.priority === value) ? null : value;
  saveData();
  render();
}

function toggleNota(id){
  const el = document.getElementById("nota_" + id);
  if(el) el.classList.toggle("show");
}

function moveTaskToDia(id, nuevoDia){
  pushUndo();
  const t = tasks.find(x => x.id === id);
  if(t) t.dia = nuevoDia;
  saveData();
  render();
}

function prioOrder(p){
  if(p === "rojo") return 0;
  if(p === "amarillo") return 1;
  if(p === "verde") return 2;
  return 3;
}

function render(){
  const board = document.getElementById("board");
  board.innerHTML = "";
  const todayIdx = getTodayDiaIndex();

  DIAS.forEach((diaNombre, diaIdx) => {
    const col = document.createElement("div");
    col.className = "day-col" + (diaIdx === todayIdx ? " today" : "");
    col.dataset.dia = diaIdx;

    const dayTasks = tasks
      .filter(t => t.dia === diaIdx)
      .sort((a,b) => {
        const pa = prioOrder(a.priority), pb = prioOrder(b.priority);
        if(pa !== pb) return pa - pb;
        return (a.hora || "").localeCompare(b.hora || "");
      });

    const header = document.createElement("div");
    header.className = "day-header";
    header.innerHTML = `<span>${diaNombre}</span><span class="day-count">${dayTasks.length}</span>`;
    col.appendChild(header);

    if(dayTasks.length === 0){
      const empty = document.createElement("div");
      empty.className = "empty-day";
      empty.textContent = "Sin tareas";
      col.appendChild(empty);
    }

    dayTasks.forEach(t => {
      const card = document.createElement("div");
      card.className = "card" + (t.priority ? " " + t.priority : "") + (t.done ? " done" : "");
      card.draggable = true;
      card.dataset.id = t.id;

      card.addEventListener("dragstart", (e) => {
        e.dataTransfer.setData("text/plain", t.id);
      });

      const notaHtml = t.nota ? `<div class="card-nota" id="nota_${t.id}">${escapeHtml(t.nota)}</div>` : "";
      const notaBtn = t.nota ? `<button onclick="toggleNota('${t.id}')">Nota</button>` : "";

      card.innerHTML = `
        <div class="card-top">
          <span class="card-hora">${t.hora ? escapeHtml(t.hora) : ""}</span>
          <div class="priority-dots">
            <button type="button" class="priority-dot${t.priority==="rojo"?" active":""}" style="background:#B2483C;" onclick="changePriority('${t.id}','rojo')" title="Rojo"></button>
            <button type="button" class="priority-dot${t.priority==="amarillo"?" active":""}" style="background:#F2B705;" onclick="changePriority('${t.id}','amarillo')" title="Amarillo"></button>
            <button type="button" class="priority-dot${t.priority==="verde"?" active":""}" style="background:#4C8C5B;" onclick="changePriority('${t.id}','verde')" title="Verde"></button>
          </div>
        </div>
        <div class="card-text">${escapeHtml(t.texto)}</div>
        ${t.cliente ? `<div class="card-cliente">${escapeHtml(t.cliente)}</div>` : ""}
        ${notaHtml}
        <div class="card-actions">
          <button onclick="toggleDone('${t.id}')">${t.done ? "Reabrir" : "Hecho"}</button>
          ${notaBtn}
          <button onclick="editTask('${t.id}')">Editar</button>
          <button onclick="deleteTask('${t.id}')">Borrar</button>
        </div>
      `;
      col.appendChild(card);
    });

    col.addEventListener("dragover", (e) => e.preventDefault());
    col.addEventListener("drop", (e) => {
      e.preventDefault();
      const id = e.dataTransfer.getData("text/plain");
      moveTaskToDia(id, diaIdx);
    });

    board.appendChild(col);
  });

  updateUndoRedoButtons();
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

// ---- Exportar / Importar copia de seguridad ----
function exportBackup(){
  const data = JSON.stringify({tasks}, null, 2);
  const blob = new Blob([data], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const fecha = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `agenda_backup_${fecha}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed.tasks || !Array.isArray(parsed.tasks)){
        alert("El archivo no tiene el formato esperado.");
        return;
      }
      pushUndo();
      tasks = parsed.tasks;
      saveData();
      render();
      alert("Copia importada correctamente.");
    }catch(err){
      alert("No se pudo leer el archivo. Comprueba que sea una copia de seguridad válida.");
    }
  };
  reader.readAsText(file);
}

// ---- Imprimir / PDF ----
function buildPrintContent(){
  document.getElementById("printFecha").textContent = document.getElementById("fechaActual").textContent;
  const container = document.getElementById("printContent");
  container.innerHTML = "";

  DIAS.forEach((diaNombre, diaIdx) => {
    const dayTasks = tasks
      .filter(t => t.dia === diaIdx)
      .sort((a,b) => {
        const pa = prioOrder(a.priority), pb = prioOrder(b.priority);
        if(pa !== pb) return pa - pb;
        return (a.hora || "").localeCompare(b.hora || "");
      });

    const titleEl = document.createElement("div");
    titleEl.className = "print-day-title";
    titleEl.textContent = diaNombre;
    container.appendChild(titleEl);

    if(dayTasks.length === 0){
      const p = document.createElement("div");
      p.className = "print-task";
      p.textContent = "Sin tareas";
      container.appendChild(p);
    } else {
      dayTasks.forEach(t => {
        const p = document.createElement("div");
        p.className = "print-task";
        let linea = `<b>${t.hora ? escapeHtml(t.hora) : "--:--"}</b> ${escapeHtml(t.texto)}`;
        if(t.cliente) linea += ` — ${escapeHtml(t.cliente)}`;
        if(t.done) linea = `<s>${linea}</s>`;
        if(t.nota) linea += `<br><span style="color:#888;">${escapeHtml(t.nota)}</span>`;
        p.innerHTML = linea;
        container.appendChild(p);
      });
    }
  });
}

function printAgenda(){
  buildPrintContent();
  window.print();
}

async function exportPdf(){
  buildPrintContent();
  const area = document.getElementById("printArea");
  area.style.display = "block";
  area.style.position = "absolute";
  area.style.top = "20000px";
  area.style.left = "0";
  area.style.width = "800px";
  area.style.background = "#fff";
  area.style.padding = "20px";

  try{
    const canvas = await html2canvas(area, {scale: 2});
    const imgData = canvas.toDataURL("image/png");
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF("p", "mm", "a4");
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = pageWidth;
    const imgHeight = (canvas.height * imgWidth) / canvas.width;

    let heightLeft = imgHeight;
    let position = 0;

    pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;

    while(heightLeft > 0){
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }

    const fecha = new Date().toISOString().slice(0,10);
    pdf.save(`agenda_semanal_${fecha}.pdf`);
  }catch(err){
    alert("No se pudo generar el PDF. Comprueba tu conexión a internet (se necesita la primera vez para cargar las librerías).");
  }finally{
    area.style.display = "none";
  }
}

// ---- Eventos ----
document.getElementById("addBtn").addEventListener("click", addTask);
document.querySelectorAll("#prioToolbar .priority-dot").forEach(dot => {
  dot.addEventListener("click", () => {
    const current = document.getElementById("prioInput").value;
    const chosen = dot.dataset.priority;
    const nuevo = (current === chosen) ? "" : chosen;
    document.getElementById("prioInput").value = nuevo;
    document.querySelectorAll("#prioToolbar .priority-dot").forEach(d => {
      d.classList.toggle("active", d.dataset.priority === nuevo);
    });
  });
});

document.getElementById("fechaActual").addEventListener("click", editarFecha);

const VIEW_KEY = "agenda_semanal_view_v1";
function aplicarVista(vertical){
  const board = document.getElementById("board");
  const btn = document.getElementById("viewBtn");
  board.classList.toggle("vertical", vertical);
  btn.textContent = vertical ? "Vista: Vertical" : "Vista: Fila";
  localStorage.setItem(VIEW_KEY, vertical ? "vertical" : "fila");
}
document.getElementById("viewBtn").addEventListener("click", () => {
  const esVertical = document.getElementById("board").classList.contains("vertical");
  aplicarVista(!esVertical);
});
document.getElementById("textoInput").addEventListener("keypress", (e) => {
  if(e.key === "Enter") addTask();
});
document.getElementById("undoBtn").addEventListener("click", undo);
document.getElementById("redoBtn").addEventListener("click", redo);
document.getElementById("printBtn").addEventListener("click", printAgenda);
document.getElementById("pdfBtn").addEventListener("click", exportPdf);
document.getElementById("exportBtn").addEventListener("click", exportBackup);
document.getElementById("importBtn").addEventListener("click", () => {
  document.getElementById("importFile").click();
});
document.getElementById("importFile").addEventListener("change", (e) => {
  if(e.target.files.length > 0) importBackup(e.target.files[0]);
  e.target.value = "";
});

document.addEventListener("keydown", (e) => {
  if((e.ctrlKey || e.metaKey) && e.key === "z"){ e.preventDefault(); undo(); }
  if((e.ctrlKey || e.metaKey) && e.key === "y"){ e.preventDefault(); redo(); }
});

// ---- Init ----
loadData();
setFechaActual();
initDiaSelect();
render();
aplicarVista(localStorage.getItem(VIEW_KEY) === "vertical");
</script>
